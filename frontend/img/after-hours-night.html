<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>After Hours — Architectural Night</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#030407;color:#f7f3ea;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{width:min(1120px,94vw)}
.scene{position:relative;min-height:650px;overflow:hidden;border-radius:30px;background:linear-gradient(180deg,#11121a 0%,#191923 42%,#08090d 100%);border:1px solid #ffffff16;box-shadow:0 35px 100px #000c,inset 0 1px #fff1}
.sky{position:absolute;inset:0;background:radial-gradient(circle at 72% 18%,#f4d9a614,transparent 18%),linear-gradient(180deg,#10131c,#090b11 72%);animation:sky 8s ease-in-out infinite}
.moon{position:absolute;right:14%;top:12%;width:88px;height:88px;border-radius:50%;background:#fff8df;box-shadow:0 0 45px #ffe6a633,0 0 110px #ffe6a60d}
.moon:after{content:"";position:absolute;inset:8px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fffdf1,#eee3c6 70%);opacity:.9}
.stars{position:absolute;inset:0;background-image:radial-gradient(circle at 10% 24%,#fff 0 1px,transparent 1.8px),radial-gradient(circle at 35% 15%,#fff 0 1px,transparent 1.8px),radial-gradient(circle at 54% 28%,#fff 0 1px,transparent 1.8px),radial-gradient(circle at 88% 34%,#fff 0 1px,transparent 1.8px),radial-gradient(circle at 78% 12%,#fff 0 1px,transparent 1.8px);opacity:.55;animation:stars 5s ease-in-out infinite alternate}
.header{position:absolute;z-index:10;left:34px;right:34px;top:30px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;gap:12px;align-items:center;text-transform:uppercase;letter-spacing:.2em;font-size:11px;color:#d8d4c9}
.logo{width:35px;height:35px;border:1px solid #e5d8ba44;border-radius:11px;display:grid;place-items:center;background:#fff6df08}
.logo:before{content:"";width:12px;height:12px;border:1px solid #e7d7b2;border-radius:2px;transform:rotate(45deg);box-shadow:0 0 15px #efdca944}
.clock{font-variant-numeric:tabular-nums;color:#aaa8a2;font-size:11px;letter-spacing:.12em}
.copy{position:absolute;z-index:9;left:34px;top:120px;width:390px}
.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.27em;color:#d5b978;margin-bottom:18px}
h1{font-size:clamp(45px,6vw,78px);line-height:.9;letter-spacing:-.065em;margin:0 0 21px;font-weight:700}
h1 span{color:#d9bd82}
.copy p{margin:0;color:#999ca5;line-height:1.75;font-size:15px;max-width:365px}
.city{position:absolute;z-index:3;left:0;right:0;bottom:0;height:58%;display:flex;align-items:flex-end;justify-content:center;gap:8px}
.bld{position:relative;background:linear-gradient(90deg,#0a0b0f,#17191f,#08090d);border:1px solid #ffffff08;box-shadow:inset 0 0 30px #000}
.b1{width:11%;height:57%}.b2{width:8%;height:40%}.b3{width:17%;height:76%}.b4{width:9%;height:49%}.b5{width:13%;height:62%}.b6{width:7%;height:45%}.b7{width:15%;height:68%}
.windows{position:absolute;inset:12px 8px;background-image:repeating-linear-gradient(90deg,transparent 0 12px,#d7b978 13px 14px,transparent 15px 25px),repeating-linear-gradient(180deg,transparent 0 16px,#e8c978 17px 18px,transparent 19px 30px);opacity:.17;animation:windows 3.7s steps(3,end) infinite}
.b3 .windows{opacity:.28}.b5 .windows{opacity:.22}
.roof{position:absolute;left:-8%;right:-8%;top:-7px;height:8px;background:#24262c;border:1px solid #ffffff10}
.antenna{position:absolute;top:-50px;left:50%;height:50px;border-left:1px solid #7e8188}.antenna:after{content:"";position:absolute;top:-3px;left:-2px;width:4px;height:4px;border-radius:50%;background:#d7bd82;box-shadow:0 0 12px #d7bd82}
.rain{position:absolute;z-index:8;inset:0;pointer-events:none;background-image:linear-gradient(110deg,transparent 0 48%,#ffffff14 49%,transparent 50%);background-size:90px 160px;animation:rain .75s linear infinite;opacity:.35}
.reflection{position:absolute;z-index:4;left:0;right:0;bottom:0;height:27%;background:linear-gradient(180deg,#080a0d,#020304);transform:skewY(-1deg);opacity:.8}
.streetlights{position:absolute;z-index:6;bottom:15%;left:0;right:0;height:100px;background:radial-gradient(ellipse at 16% 60%,#d8b66a66 0 2px,transparent 3px),radial-gradient(ellipse at 29% 40%,#d8b66a55 0 2px,transparent 3px),radial-gradient(ellipse at 68% 55%,#d8b66a55 0 2px,transparent 3px),radial-gradient(ellipse at 82% 35%,#d8b66a66 0 2px,transparent 3px);filter:blur(1px)}
.neon{position:absolute;z-index:7;bottom:20%;left:42%;width:75px;height:3px;background:#d8bd82;box-shadow:0 0 20px #d8bd82;animation:neon 2.2s ease-in-out infinite}
.panel{position:absolute;z-index:10;right:34px;bottom:34px;width:220px;padding:17px;border:1px solid #ffffff14;background:#101218aa;backdrop-filter:blur(16px);border-radius:17px;box-shadow:0 18px 45px #0008}
.panel small{display:block;color:#7e828a;font-size:9px;text-transform:uppercase;letter-spacing:.18em;margin-bottom:9px}
.panel strong{font-size:18px;font-weight:600}.line{height:1px;background:#ffffff10;margin:14px 0}.row{display:flex;justify-content:space-between;color:#8f9299;font-size:11px}.row b{color:#d7c49c;font-weight:500}
.controls{position:absolute;z-index:12;left:34px;bottom:34px;display:flex;gap:8px}
button{border:1px solid #ffffff18;background:#101218cc;color:#eeeae1;border-radius:12px;padding:10px 15px;cursor:pointer;font-weight:650;backdrop-filter:blur(12px);transition:.2s}
button:hover{transform:translateY(-2px);border-color:#d7bd8266;box-shadow:0 9px 25px #0007}.primary{background:#d7bd8212}
.status{text-align:center;margin-top:13px;color:#656871;font-size:12px}
.paused *{animation-play-state:paused!important}
@keyframes sky{50%{filter:brightness(1.07)}}@keyframes stars{to{opacity:.8}}
@keyframes windows{50%{opacity:.11}}@keyframes rain{to{background-position:90px 160px}}
@keyframes neon{50%{opacity:.35;transform:scaleX(.75)}}
@media(max-width:850px){
.scene{min-height:720px}.copy{left:25px;top:105px;right:25px;width:auto}.moon{right:9%;top:11%;width:65px;height:65px}
.city{height:54%}.panel{right:25px;bottom:28px;width:190px}.controls{left:25px;bottom:28px}.bld{gap:3px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
<div id="scene" class="scene">
<div class="sky"></div><div class="stars"></div><div class="moon"></div><div class="rain"></div>
<header class="header">
<div class="brand"><span class="logo"></span>After Hours</div>
<div class="clock" id="clock">23:47:08 · LOCAL</div>
</header>
<section class="copy">
<div class="eyebrow">Urban architecture</div>
<h1>Where the city <span>never sleeps.</span></h1>
<p>A cinematic study of architecture, atmosphere and the quiet energy that appears after dark.</p>
</section>
<div class="city">
<div class="bld b1"><div class="roof"></div><div class="windows"></div></div>
<div class="bld b2"><div class="windows"></div></div>
<div class="bld b3"><div class="roof"></div><div class="antenna"></div><div class="windows"></div></div>
<div class="bld b4"><div class="windows"></div></div>
<div class="bld b5"><div class="roof"></div><div class="windows"></div></div>
<div class="bld b6"><div class="windows"></div></div>
<div class="bld b7"><div class="windows"></div></div>
</div>
<div class="reflection"></div><div class="streetlights"></div><div class="neon"></div>
<div class="panel"><small>Night report</small><strong>City ambience</strong><div class="line"></div><div class="row"><span>Visibility</span><b>94%</b></div><div class="row"><span>Sky</span><b>Clear</b></div><div class="row"><span>Activity</span><b>High</b></div></div>
<div class="controls"><button class="primary" id="toggle">Pause scene</button><button id="restart">Restart</button></div>
</div>
<div class="status" id="status">Cinematic city study · Ambient motion · Responsive design</div>
</div>
<script>
const scene=document.getElementById('scene'),toggle=document.getElementById('toggle'),restart=document.getElementById('restart'),status=document.getElementById('status'),clock=document.getElementById('clock');
let paused=false;
function tick(){const d=new Date();clock.textContent=d.toLocaleTimeString([], {hour12:false})+' · LOCAL'}
setInterval(tick,1000);tick();
toggle.onclick=()=>{paused=!paused;scene.classList.toggle('paused',paused);toggle.textContent=paused?'Resume scene':'Pause scene';status.textContent=paused?'Scene paused · press Resume scene to continue':'Cinematic city study · Ambient motion · Responsive design'};
restart.onclick=()=>{paused=false;scene.classList.remove('paused');toggle.textContent='Pause scene';status.textContent='Scene restarted · Ambient motion · Responsive design'};
</script>
</body>
</html>
