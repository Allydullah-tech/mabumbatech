<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Aurora — Interactive Showcase</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#05070d;
  --panel:rgba(14,19,32,.68);
  --line:rgba(160,190,255,.16);
  --text:#f4f7ff;
  --muted:#8995ad;
  --cyan:#5ce1e6;
  --violet:#9b7cff;
  --pink:#ff6fd8;
}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;
  background:
    radial-gradient(circle at 15% 20%,rgba(92,225,230,.10),transparent 28%),
    radial-gradient(circle at 85% 80%,rgba(155,124,255,.12),transparent 30%),
    #05070d;
  color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.wrap{width:min(1120px,94vw)}
.stage{
  position:relative;overflow:hidden;min-height:650px;border-radius:30px;
  border:1px solid rgba(180,205,255,.18);
  background:linear-gradient(145deg,rgba(9,13,24,.97),rgba(5,8,16,.94));
  box-shadow:0 35px 100px rgba(0,0,0,.55),inset 0 1px rgba(255,255,255,.05);
}
.grid{
  position:absolute;inset:42% -10% -28%;
  background-image:
    linear-gradient(rgba(130,160,220,.12) 1px,transparent 1px),
    linear-gradient(90deg,rgba(130,160,220,.12) 1px,transparent 1px);
  background-size:55px 55px;
  transform:perspective(520px) rotateX(64deg) scale(1.25);
  transform-origin:center top;
  mask-image:linear-gradient(to bottom,transparent,black 15%,black 80%,transparent);
  animation:gridMove 8s linear infinite;
}
.noise{position:absolute;inset:0;opacity:.045;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");pointer-events:none}
.header{position:absolute;top:30px;left:36px;right:36px;display:flex;align-items:center;justify-content:space-between;z-index:5}
.brand{display:flex;align-items:center;gap:12px;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#cbd5ee}
.logo{
  width:34px;height:34px;border-radius:11px;border:1px solid rgba(92,225,230,.35);
  display:grid;place-items:center;background:rgba(92,225,230,.08);
  box-shadow:0 0 28px rgba(92,225,230,.15);
}
.logo:before{content:"";width:11px;height:11px;border-radius:50%;background:var(--cyan);box-shadow:0 0 18px var(--cyan)}
.live{font-size:11px;color:#aeb8ce;display:flex;align-items:center;gap:8px}
.live i{width:7px;height:7px;border-radius:50%;background:#61f2a2;box-shadow:0 0 12px #61f2a2;animation:pulse 1.5s infinite}
.intro{position:absolute;left:36px;top:115px;z-index:4;max-width:410px}
.kicker{color:var(--cyan);font-size:12px;letter-spacing:.22em;text-transform:uppercase;margin-bottom:16px}
h1{font-size:clamp(42px,6vw,76px);line-height:.94;letter-spacing:-.055em;margin:0 0 20px;font-weight:750}
h1 span{background:linear-gradient(100deg,#fff 10%,#aeeff2 45%,#a98cff 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
.desc{color:var(--muted);font-size:15px;line-height:1.7;max-width:390px}
.orbit{
  position:absolute;width:390px;height:390px;border-radius:50%;
  right:12%;top:18%;z-index:2;
  border:1px solid rgba(177,194,255,.13);
  box-shadow:0 0 80px rgba(113,92,255,.10),inset 0 0 70px rgba(92,225,230,.05);
  animation:orbitFloat 5s ease-in-out infinite;
}
.orbit:before,.orbit:after{content:"";position:absolute;inset:-38px;border-radius:50%;border:1px solid rgba(92,225,230,.10);transform:rotate(28deg) scaleY(.38)}
.orbit:after{inset:-65px;border-color:rgba(155,124,255,.10);transform:rotate(-34deg) scaleY(.32)}
.core{
  position:absolute;left:50%;top:50%;width:165px;height:165px;transform:translate(-50%,-50%);
  border-radius:50%;
  background:
    radial-gradient(circle at 34% 27%,#fff 0 3%,#d7ffff 7%,#67dfe7 20%,#705ce5 48%,#191a43 73%,#080a18 100%);
  box-shadow:0 0 35px rgba(92,225,230,.45),0 0 100px rgba(128,96,255,.24),inset -25px -20px 45px rgba(0,0,0,.45);
  animation:corePulse 3.5s ease-in-out infinite;
}
.core:before{content:"";position:absolute;inset:18px;border-radius:50%;border:1px solid rgba(255,255,255,.2)}
.ring{
  position:absolute;left:50%;top:50%;width:315px;height:92px;transform:translate(-50%,-50%) rotate(-20deg);
  border:2px solid rgba(208,221,255,.3);border-radius:50%;
  box-shadow:0 0 22px rgba(92,225,230,.13);
  animation:spin 10s linear infinite;
}
.ring2{width:245px;height:65px;transform:translate(-50%,-50%) rotate(58deg);border-color:rgba(255,111,216,.2);animation-direction:reverse;animation-duration:7s}
.satellite{position:absolute;width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 16px 4px var(--cyan);top:24px;left:50%;animation:dot 10s linear infinite;transform-origin:0 170px}
.particles{position:absolute;inset:0;z-index:1}
.particle{position:absolute;width:3px;height:3px;border-radius:50%;background:#d8e8ff;box-shadow:0 0 9px #9cc8ff;animation:twinkle 2.2s ease-in-out infinite alternate}
.p1{left:9%;top:25%;animation-delay:.2s}.p2{left:49%;top:16%;animation-delay:.8s}.p3{left:78%;top:20%;animation-delay:1.1s}
.p4{left:68%;top:69%;animation-delay:.4s}.p5{left:27%;top:73%;animation-delay:1.5s}.p6{left:91%;top:52%;animation-delay:.9s}
.stats{
  position:absolute;left:36px;bottom:38px;z-index:5;display:flex;gap:10px;
}
.card{
  min-width:145px;padding:14px 16px;border:1px solid var(--line);border-radius:16px;
  background:rgba(13,18,31,.62);backdrop-filter:blur(14px);
  box-shadow:inset 0 1px rgba(255,255,255,.04);
}
.card small{display:block;color:#758198;font-size:10px;text-transform:uppercase;letter-spacing:.15em;margin-bottom:7px}
.card strong{font-size:17px;letter-spacing:-.02em}
.actions{position:absolute;right:36px;bottom:42px;z-index:5;display:flex;gap:9px}
button{
  border:1px solid rgba(180,205,255,.18);background:rgba(16,22,38,.76);color:#edf3ff;
  border-radius:13px;padding:11px 17px;cursor:pointer;font-weight:650;transition:.25s;
  backdrop-filter:blur(10px);
}
button:hover{transform:translateY(-2px);border-color:rgba(92,225,230,.4);box-shadow:0 10px 25px rgba(0,0,0,.2)}
button.primary{background:linear-gradient(135deg,rgba(92,225,230,.17),rgba(155,124,255,.18))}
.status{text-align:center;margin-top:13px;color:#6f7a91;font-size:12px;letter-spacing:.04em}
.paused *{animation-play-state:paused!important}
@keyframes gridMove{to{background-position:0 55px}}
@keyframes orbitFloat{50%{transform:translateY(-10px) scale(1.015)}}
@keyframes corePulse{50%{transform:translate(-50%,-50%) scale(1.035);box-shadow:0 0 45px rgba(92,225,230,.5),0 0 120px rgba(128,96,255,.3),inset -25px -20px 45px rgba(0,0,0,.45)}}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(340deg)}}
@keyframes dot{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.35;transform:scale(.7)}}
@keyframes twinkle{to{opacity:.2;transform:scale(.45)}}
@media(max-width:820px){
  .stage{min-height:720px}.intro{top:105px;left:25px;right:25px}.orbit{width:300px;height:300px;right:50%;transform:translateX(50%);top:38%}
  .core{width:125px;height:125px}.ring{width:245px;height:70px}.ring2{width:190px;height:54px}
  .stats{left:25px;bottom:28px;right:25px}.card{flex:1;min-width:0}.card:nth-child(3){display:none}
  .actions{right:25px;bottom:90px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div id="scene" class="stage">
    <div class="grid"></div><div class="noise"></div>
    <div class="particles">
      <i class="particle p1"></i><i class="particle p2"></i><i class="particle p3"></i>
      <i class="particle p4"></i><i class="particle p5"></i><i class="particle p6"></i>
    </div>

    <header class="header">
      <div class="brand"><span class="logo"></span><span>Digital Aurora</span></div>
      <div class="live"><i></i> System online</div>
    </header>

    <section class="intro">
      <div class="kicker">Creative technology</div>
      <h1>Ideas in <span>motion.</span></h1>
      <p class="desc">An immersive visual concept combining light, depth and motion into a refined digital experience.</p>
    </section>

    <div class="orbit">
      <div class="ring"></div><div class="ring ring2"></div>
      <div class="satellite"></div><div class="core"></div>
    </div>

    <div class="stats">
      <div class="card"><small>Signal</small><strong>98.7%</strong></div>
      <div class="card"><small>Motion</small><strong>60 FPS</strong></div>
      <div class="card"><small>State</small><strong>Active</strong></div>
    </div>

    <div class="actions">
      <button class="primary" id="toggle">Pause motion</button>
      <button id="restart">Restart</button>
    </div>
  </div>
  <div class="status" id="status">Interactive scene • CSS animation • responsive layout</div>
</div>

<script>
const scene=document.getElementById('scene');
const toggle=document.getElementById('toggle');
const restart=document.getElementById('restart');
const status=document.getElementById('status');
let paused=false;

toggle.onclick=()=>{
  paused=!paused;
  scene.classList.toggle('paused',paused);
  toggle.textContent=paused?'Play motion':'Pause motion';
  status.textContent=paused?'Motion paused • press Play motion to continue':'Interactive scene • CSS animation • responsive layout';
};

restart.onclick=()=>{
  paused=false;
  scene.classList.remove('paused');
  toggle.textContent='Pause motion';
  status.textContent='Scene restarted • CSS animation • responsive layout';
};
</script>
</body>
</html>
