<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Leave — MABUMBA TECH</title>
<link rel="icon" href="../../img/favicon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/forms.css">
<link rel="stylesheet" href="../../css/dashboard.css">
</head>
<body class="dash-body">
<div class="dash-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="dash-main">
    <div class="dash-topbar" id="dashTopbar"></div>
    <div class="dash-content">
      <div id="flashContainer"></div>

      <div class="panel">
        <div class="panel-head">
          <h3><i class="bi bi-calendar-check"></i> My Leave</h3>
          <button class="btn btn-primary btn-sm" onclick="openModal('newLeaveModal')"><i class="bi bi-plus-circle"></i> Request Leave</button>
        </div>
        <div class="table-wrap">
          <table class="tbl">
            <thead><tr><th>Type</th><th>Dates</th><th>Reason</th><th>Status</th><th>Requested</th></tr></thead>
            <tbody id="leaveTableBody"><tr><td colspan="5" class="empty-state">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="modal-bg" id="newLeaveModal">
  <div class="modal-box">
    <span class="modal-close" onclick="closeModal('newLeaveModal')"><i class="bi bi-x-lg"></i></span>
    <h3><i class="bi bi-plus-circle"></i> Request Leave</h3>
    <form id="newLeaveForm">
      <div class="form-group"><label>Leave Type</label>
        <select name="leave_type">
          <option value="annual">Annual</option>
          <option value="sick">Sick</option>
          <option value="unpaid">Unpaid</option>
          <option value="maternity_paternity">Maternity/Paternity</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Start Date</label><input type="date" name="start_date" required></div>
        <div class="form-group"><label>End Date</label><input type="date" name="end_date" required></div>
      </div>
      <div class="form-group"><label>Reason (optional)</label><textarea name="reason" rows="2"></textarea></div>
      <button class="btn btn-primary btn-block"><i class="bi bi-check2"></i> Submit Request</button>
    </form>
  </div>
</div>

<script src="../../js/config.js"></script>
<script src="../../js/layout-dash.js"></script>
<script src="../../js/dashboard.js"></script>
<script src="../../js/pages/staff-leave.js"></script>
</body>
</html>
