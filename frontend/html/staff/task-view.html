<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Details — MABUMBA TECH</title>
<link rel="icon" href="../../img/favicon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/forms.css">
<link rel="stylesheet" href="../../css/dashboard.css">
</head>
<body class="dash-body">
<div class="dash-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="dash-main">
    <div class="dash-topbar" id="dashTopbar"></div>
    <div class="dash-content">
      <div id="flashContainer"></div>
      <a href="tasks.html" class="small"><i class="bi bi-arrow-left"></i> Back to my tasks</a>
      <div id="taskDetail" style="margin-top:12px;">Loading…</div>
      <div id="threadContainer"></div>
    </div>
  </main>
</div>

<div class="modal-bg" id="completeTaskModal">
  <div class="modal-box">
    <span class="modal-close" onclick="closeModal('completeTaskModal')"><i class="bi bi-x-lg"></i></span>
    <h3><i class="bi bi-check2-circle"></i> Complete Task</h3>
    <form id="completeTaskForm">
      <div class="form-group"><label>Completion Remark (optional)</label><textarea name="remark" rows="3"></textarea></div>
      <button class="btn btn-primary btn-block"><i class="bi bi-check2"></i> Confirm Completion</button>
    </form>
  </div>
</div>

<script src="../../js/config.js"></script>
<script src="../../js/layout-dash.js"></script>
<script src="../../js/dashboard.js"></script>
<script src="../../js/request-thread.js"></script>
<script src="../../js/project-panels.js"></script>
<script src="../../js/pages/staff-task-view.js"></script>
</body>
</html>
