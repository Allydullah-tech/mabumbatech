<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Requests — MABUMBA TECH</title>
<link rel="icon" href="../../img/favicon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/forms.css">
<link rel="stylesheet" href="../../css/dashboard.css">
</head>
<body class="dash-body">
<div class="dash-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="dash-main">
    <div class="dash-topbar" id="dashTopbar"></div>
    <div class="dash-content">
      <div id="flashContainer"></div>

      <!-- Product Requests desk (built by admin-marketing-acquisition.js, product-desk mode) -->
      <div id="deskBody">Loading…</div>
    </div>
  </main>
</div>

<div class="modal-bg" id="requestDetailModal">
  <div class="modal-box" style="max-width:600px;">
    <span class="modal-close" onclick="closeModal('requestDetailModal')"><i class="bi bi-x-lg"></i></span>
    <div id="requestDetailBody">Loading…</div>
  </div>
</div>

<div class="modal-bg" id="dealSaleModal">
  <div class="modal-box" style="max-width:560px;">
    <span class="modal-close" onclick="closeModal('dealSaleModal')"><i class="bi bi-x-lg"></i></span>
    <h3 id="dealSaleTitle" style="margin-top:0;"><i class="bi bi-cash-coin"></i> Record the Sale</h3>
    <p class="small" id="dealSaleIntro"></p>
    <form id="dealSaleForm">
      <div class="form-group">
        <label>Product Sold</label>
        <select id="dealProduct" required></select>
        <div class="small" id="dealProductHint" style="margin-top:4px;"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Quantity</label><input type="number" id="dealQty" min="1" step="1" required></div>
        <div class="form-group"><label>Unit Price <span class="small">(blank = standard price)</span></label><input type="number" id="dealPrice" min="0" step="0.01"></div>
      </div>
      <p class="small" style="margin:0 0 10px;">Sale total: <b id="dealTotal">0.00</b></p>
      <div class="form-row">
        <div class="form-group">
          <label>Payment</label>
          <select id="dealMethod">
            <option value="cash">Cash</option>
            <option value="mobile_money">Mobile Money</option>
            <option value="bank_transfer">Bank Transfer</option>
            <option value="card">Card</option>
            <option value="credit">Credit (pays later)</option>
          </select>
        </div>
        <div class="form-group" id="dealChannelBox" style="display:none;"><label>Provider / Bank</label><select id="dealChannel"></select></div>
      </div>
      <div id="dealCreditBox" style="display:none;">
        <div class="form-row">
          <div class="form-group"><label>Customer Name</label><input type="text" id="dealCustName"></div>
          <div class="form-group"><label>Customer Phone</label><input type="text" id="dealCustPhone"></div>
        </div>
        <div class="form-group"><label>Address <span class="small">(optional)</span></label><input type="text" id="dealCustAddress"></div>
        <div class="form-row">
          <div class="form-group"><label>Due Date <span class="small">(optional)</span></label><input type="date" id="dealDue"></div>
          <div class="form-group"><label>Paid Now <span class="small">(optional)</span></label><input type="number" id="dealDeposit" min="0" step="0.01"></div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Paid Now Via</label>
            <select id="dealDepositMethod">
              <option value="cash">Cash</option>
              <option value="mobile_money">Mobile Money</option>
              <option value="bank_transfer">Bank Transfer</option>
              <option value="card">Card</option>
            </select>
          </div>
          <div class="form-group" id="dealDepositChannelBox" style="display:none;"><label>Provider / Bank</label><select id="dealDepositChannel"></select></div>
        </div>
      </div>
      <div class="form-group" id="dealNoteBox"><label>Note <span class="small">(optional, added to the request history)</span></label><textarea id="dealNote" rows="2"></textarea></div>
      <button class="btn btn-primary btn-block" id="dealSubmit"><i class="bi bi-check2-circle"></i> Complete Deal &amp; Record Sale</button>
    </form>
  </div>
</div>

<script>window.PRODUCT_REQUESTS_PAGE = true;</script>
<script src="../../js/config.js"></script>
<script src="../../js/layout-dash.js"></script>
<script src="../../js/dashboard.js"></script>
<script src="../../js/pages/admin-marketing-acquisition.js?v=5"></script>
</body>
</html>
