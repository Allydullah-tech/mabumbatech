<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile — MABUMBA TECH</title>
<link rel="icon" href="../../img/favicon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/forms.css">
<link rel="stylesheet" href="../../css/dashboard.css">
</head>
<body class="dash-body">
<div class="dash-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="dash-main">
    <div class="dash-topbar" id="dashTopbar"></div>
    <div class="dash-content">
      <div id="flashContainer"></div>

      <div class="grid grid-2" style="align-items:start;">
        <div class="panel">
          <div class="panel-head"><h3><i class="bi bi-person"></i> Profile Details</h3></div>
          <div class="panel-body">
            <div style="text-align:center;padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid var(--line);">
              <div class="avatar-sm" id="avatarPreview" style="width:84px;height:84px;font-size:1.8rem;margin:0 auto 10px;cursor:pointer;" onclick="document.getElementById('avatarInput').click();" title="Click to change photo">?</div>
              <input type="file" id="avatarInput" accept=".jpg,.jpeg,.png,.webp" style="display:none;">
              <p class="small" style="margin:0;">Click the circle to change your photo (JPG/PNG/WEBP, under 2MB). This is the photo shown on the public Team page once your profile is made public.</p>
            </div>
            <form id="profileForm">
              <div class="form-group"><label>Full Name</label><input type="text" name="full_name" required></div>
              <div class="form-group"><label>Username</label><input type="text" id="usernameField" disabled></div>
              <div class="form-group"><label>Email</label><input type="email" id="emailField" disabled></div>
              <div class="form-group"><label>Phone</label><input type="text" name="phone"></div>
              <div class="form-group"><label>Position Title</label><input type="text" name="position_title"></div>
              <button class="btn btn-primary"><i class="bi bi-check2"></i> Save Changes</button>
            </form>
          </div>
        </div>
        <div class="panel">
          <div class="panel-head"><h3><i class="bi bi-shield-lock"></i> Change Password</h3></div>
          <div class="panel-body">
            <form id="passwordForm">
              <div class="form-group"><label>Current Password</label><input type="password" name="current_password" required></div>
              <div class="form-group"><label>New Password</label><input type="password" name="new_password" required minlength="6"></div>
              <div class="form-group"><label>Confirm New Password</label><input type="password" name="confirm_password" required minlength="6"></div>
              <button class="btn btn-primary"><i class="bi bi-key"></i> Update Password</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="../../js/config.js"></script>
<script src="../../js/layout-dash.js"></script>
<script src="../../js/dashboard.js"></script>
<script src="../../js/pages/admin-profile.js"></script>
</body>
</html>
