<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — MABUMBA TECH</title>
<link rel="icon" href="../../img/favicon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="../../css/style.css?v2">
<link rel="stylesheet" href="../../css/forms.css?v2">
<link rel="stylesheet" href="../../css/auth.css?v2">
</head>
<body class="auth-body">
<div class="auth-wrap">
  <div class="auth-card">
    <a href="../home.html" class="small" style="display:inline-flex;align-items:center;gap:5px;margin-bottom:14px;"><i class="bi bi-arrow-left"></i> Back to Home</a>
    <div class="auth-brand">
      <img src="../../img/logo.png" alt="logo">
      <h1>MABUMBA TECH</h1>
      <p>Administrator Password Reset</p>
    </div>

    <div id="flashContainer"></div>

    <!-- Step 1: request a reset link by email (shown when there's no ?token=) -->
    <form id="requestForm" class="form">
      <p class="small">Enter the email address on your administrator account. We'll send you a secure link to reset your password.</p>
      <div class="form-group"><label>Email Address</label><input type="email" name="email" required autofocus></div>
      <button type="submit" class="btn btn-primary btn-block"><i class="bi bi-envelope"></i> Send Reset Link</button>
    </form>

    <!-- Step 2: set a new password (shown when the page is opened with ?token=...) -->
    <form id="resetForm" class="form" style="display:none;">
      <div class="form-group"><label>New Password</label><input type="password" name="new_password" required minlength="6"></div>
      <div class="form-group"><label>Confirm New Password</label><input type="password" name="confirm_password" required minlength="6"></div>
      <button type="submit" class="btn btn-primary btn-block"><i class="bi bi-check2-circle"></i> Reset Password</button>
    </form>

    <p class="auth-foot">Remembered it? <a href="login.html?as=admin">Back to login</a></p>
  </div>
</div>
<script src="../../js/config.js?v2"></script>
<script src="../../js/pages/auth-admin-reset-password.js?v2"></script>
</body>
</html>
