<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set New Password — MABUMBA TECH</title>
<link rel="icon" href="../../img/favicon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/forms.css">
<link rel="stylesheet" href="../../css/auth.css">
</head>
<body class="auth-body">
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">
      <img src="../../img/logo.png" alt="logo">
      <h1>MABUMBA TECH</h1>
      <p>Account Reset Required</p>
    </div>
    <div class="alert alert-info"><i class="bi bi-shield-lock"></i> Your administrator reset your access. Enter the one-digit code they gave you, then set a new password.</div>
    <div id="flashContainer"></div>

    <form id="resetForm" class="form">
      <div class="form-group">
        <label>One-Digit Code From Admin (1–9)</label>
        <input type="text" name="temp_code" maxlength="1" pattern="[1-9]" required style="text-align:center;font-size:1.2rem;font-weight:700;letter-spacing:.2em;">
      </div>
      <div class="form-group"><label>New Password</label><input type="password" name="new_password" required minlength="6"></div>
      <div class="form-group"><label>Confirm New Password</label><input type="password" name="confirm_password" required minlength="6"></div>
      <button type="submit" class="btn btn-primary btn-block"><i class="bi bi-check2-circle"></i> Set New Password</button>
    </form>
    <p class="auth-foot"><a href="#" id="logoutLink">Logout</a></p>
  </div>
</div>
<script src="../../js/config.js"></script>
<script src="../../js/pages/auth-force-reset.js"></script>
</body>
</html>
