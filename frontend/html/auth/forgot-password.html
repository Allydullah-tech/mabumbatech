<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — MABUMBA TECH</title>
<link rel="icon" href="../../img/favicon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="../../css/style.css?v2">
<link rel="stylesheet" href="../../css/forms.css?v2">
<link rel="stylesheet" href="../../css/auth.css?v2">
</head>
<body class="auth-body">
<div class="auth-wrap">
  <div class="auth-card">
    <a href="../home.html" class="small" style="display:inline-flex;align-items:center;gap:5px;margin-bottom:14px;"><i class="bi bi-arrow-left"></i> Back to Home</a>
    <div class="auth-brand">
      <img src="../../img/logo.png" alt="logo">
      <h1>MABUMBA TECH</h1>
      <p>Reset your password</p>
    </div>

    <div id="flashContainer"></div>

    <!-- Step 1: identify the account -->
    <form id="identityForm" class="form">
      <p class="small">Customer accounts only. Enter your username or email to find your security question.</p>
      <div class="form-group"><label>Username or Email</label><input type="text" name="identity" required autofocus></div>
      <button type="submit" class="btn btn-primary btn-block"><i class="bi bi-search"></i> Continue</button>
    </form>

    <!-- Step 2: answer the question and set a new password (hidden until step 1 succeeds) -->
    <form id="resetForm" class="form" style="display:none;">
      <div class="form-group">
        <label>Security Question</label>
        <p id="questionText" style="font-weight:600;margin:0 0 10px;"></p>
      </div>
      <div class="form-group"><label>Your Answer</label><input type="text" name="security_answer" required></div>
      <div class="form-group"><label>New Password</label><input type="password" name="new_password" required minlength="6"></div>
      <div class="form-group"><label>Confirm New Password</label><input type="password" name="confirm_password" required minlength="6"></div>
      <button type="submit" class="btn btn-primary btn-block"><i class="bi bi-check2-circle"></i> Reset Password</button>
    </form>

    <p class="auth-foot">Remembered it? <a href="login.html">Back to login</a></p>
  </div>
</div>
<script src="../../js/config.js?v2"></script>
<script src="../../js/pages/auth-forgot-password.js?v2"></script>
</body>
</html>
